name: smtp-relay-docker

services:
  smtp-relay:
    image: boky/postfix:5.2.1@sha256:0632783c64183446c4edeae9092a2e015fdc0c4e8a3976bdf8878a7fc2146361
    container_name: smtp-relay
    volumes:
      - smtp_queue:/var/spool/postfix
      - ${SMTP_TLS_CERT_HOST_PATH}:/etc/postfix/tls/smtp-relay.crt:ro
      - ${SMTP_TLS_KEY_HOST_PATH}:/etc/postfix/tls/smtp-relay.key:ro
    environment:
      TZ: ${TZ}
      RELAYHOST: ${RELAYHOST}
      RELAYHOST_USERNAME: ${RELAYHOST_USERNAME}
      RELAYHOST_PASSWORD: ${RELAYHOST_PASSWORD}
      ALLOWED_SENDER_DOMAINS: ${ALLOWED_SENDER_DOMAINS}
      LOG_FORMAT: ${LOG_FORMAT}
      POSTFIX_smtpd_tls_cert_file: /etc/postfix/tls/smtp-relay.crt
      POSTFIX_smtpd_tls_key_file: /etc/postfix/tls/smtp-relay.key
      POSTFIX_smtpd_tls_security_level: may
    networks:
      - relay_internal
      - relay_shared
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "postfix status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  relay_internal:
    internal: true
  relay_shared:
    name: smtp_relay_net
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: ${SMTP_RELAY_SUBNET}
          gateway: ${SMTP_RELAY_GATEWAY}

volumes:
  smtp_queue:
